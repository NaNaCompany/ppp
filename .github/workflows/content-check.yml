name: Content and static pages
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build_site.py --check
      - run: python scripts/validate_content.py
      - run: node --check script.js
      - run: node --check src/js/portal.js
      - run: node --check src/js/contact.js
      - run: git diff --check
